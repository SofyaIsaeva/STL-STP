<script type="text/babel">
const { useState, useRef, useEffect, useCallback } = React;

// ─── Toast ───
function Toast({ message, type, onClose }) {
  useEffect(() => { const t = setTimeout(onClose, 3500); return () => clearTimeout(t); }, [onClose]);
  const bg = type === 'error' ? 'bg-red-600' : type === 'success' ? 'bg-emerald-600' : 'bg-blue-600';
  return React.createElement('div', { className: `toast ${bg} text-white text-sm shadow-lg` }, message);
}

// ─── Color Mapping ───
function deviationColor(ratio) {
  const c = new THREE.Color();
  if (ratio < 0.25) c.setHex(0x3b82f6).lerp(new THREE.Color(0x22c55e), ratio / 0.25);
  else if (ratio < 0.5) c.setHex(0x22c55e).lerp(new THREE.Color(0xeab308), (ratio - 0.25) / 0.25);
  else if (ratio < 0.75) c.setHex(0xeab308).lerp(new THREE.Color(0xf97316), (ratio - 0.5) / 0.25);
  else c.setHex(0xf97316).lerp(new THREE.Color(0xef4444), (ratio - 0.75) / 0.25);
  return c;
}

// ─── STEP Parser (basic FACET_BREP support) ───
function parseSTEP(text) {
  const lines = text.split(/[\r\n]+/);
  const entities = {};
  const pointCoords = {};
  const polyLoops = {};
  const facetBreps = [];
  let hasMesh = false;

  // First pass: parse all entities
  for (const line of lines) {
    const trimmed = line.trim();
    if (!trimmed.startsWith('#')) continue;

    const idMatch = trimmed.match(/^#(\d+)=/);
    if (!idMatch) continue;
    const id = parseInt(idMatch[1]);
    const content = trimmed.substring(idMatch[0].length);

    // Cartesian Point
    const ptMatch = content.match(/^CARTESIAN_POINT\('',\(([-\d.eE+]+),([-\d.eE+]+),([-\d.eE+]+)\)\)/);
    if (ptMatch) {
      pointCoords[id] = [parseFloat(ptMatch[1]), parseFloat(ptMatch[2]), parseFloat(ptMatch[3])];
      entities[id] = { type: 'CARTESIAN_POINT', coords: pointCoords[id] };
      continue;
    }

    // Poly Loop
    const plMatch = content.match(/^POLY_LOOP\(\((#[\d,]+)\)\)/);
    if (plMatch) {
      const pointRefs = plMatch[1].split(',').map(s => parseInt(s.replace('#', '')));
      polyLoops[id] = pointRefs;
      entities[id] = { type: 'POLY_LOOP', points: pointRefs };
      continue;
    }

    // Face Outer Bound
    const fbMatch = content.match(/^FACE_OUTER_BOUND\('',(#\d+),(.*)\)/);
    if (fbMatch) {
      const loopRef = parseInt(fbMatch[1].replace('#', ''));
      entities[id] = { type: 'FACE_OUTER_BOUND', loopRef };
      continue;
    }

    // Advanced Face
    const afMatch = content.match(/^ADVANCED_FACE\('',\((#[\d,]+)\),.*\)/);
    if (afMatch) {
      const bounds = afMatch[1].split(',').map(s => parseInt(s.replace('#', '')));
      entities[id] = { type: 'ADVANCED_FACE', bounds };
      continue;
    }

    // Facet Brep
    const fbrepMatch = content.match(/^FACET_BREP\(\((#[\d,]+)\)/);
    if (fbrepMatch) {
      const faceRefs = fbrepMatch[1].split(',').map(s => parseInt(s.replace('#', '')));
      entities[id] = { type: 'FACET_BREP', faces: faceRefs };
      facetBreps.push(id);
      hasMesh = true;
      continue;
    }
  }

  if (!hasMesh || facetBreps.length === 0) {
    return null;
  }

  // Second pass: build geometry from FACET_BREP
  const vertices = [];
  const indices = [];
  const vertexMap = {};
  let vertexIdx = 0;

  function getVertexIndex(pointRef) {
    if (vertexMap[pointRef] === undefined) {
      vertexMap[pointRef] = vertexIdx++;
      const coords = pointCoords[pointRef];
      if (coords) {
        vertices.push(...coords);
      } else {
        vertices.push(0, 0, 0);
      }
    }
    return vertexMap[pointRef];
  }

  for (const fbrepId of facetBreps) {
    const fbrep = entities[fbrepId];
    if (!fbrep || fbrep.type !== 'FACET_BREP') continue;

    for (const faceRef of fbrep.faces) {
      const face = entities[faceRef];
      if (!face || face.type !== 'ADVANCED_FACE') continue;

      for (const boundRef of face.bounds) {
        const bound = entities[boundRef];
        if (!bound || bound.type !== 'FACE_OUTER_BOUND') continue;

        const loop = entities[bound.loopRef];
        if (!loop || loop.type !== 'POLY_LOOP') continue;

        const pointIndices = loop.points.map(pid => getVertexIndex(pid));

        // Create triangles from polygon (fan triangulation)
        for (let i = 1; i < pointIndices.length - 1; i++) {
          indices.push(pointIndices[0], pointIndices[i], pointIndices[i + 1]);
        }
      }
    }
  }

  if (vertices.length === 0 || indices.length === 0) return null;

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  return geometry;
}

// ─── Subdivision (1 level Catmull-Clark simplified) ───
function subdivideGeometry(geometry) {
  const pos = geometry.attributes.position.array;
  const idx = geometry.index ? Array.from(geometry.index.array) : null;
  const triCount = idx ? idx.length / 3 : pos.length / 9;

  const edgeMidpoints = {};
  function edgeKey(a, b) { return Math.min(a, b) + '_' + Math.max(a, b); }

  // Collect edge midpoints
  for (let i = 0; i < triCount; i++) {
    const i0 = idx ? idx[i * 3] : i * 3;
    const i1 = idx ? idx[i * 3 + 1] : i * 3 + 1;
    const i2 = idx ? idx[i * 3 + 2] : i * 3 + 2;

    [i0, i1, i2].forEach((a, k, arr) => {
      const b = arr[(k + 1) % 3];
      const ek = edgeKey(a, b);
      if (!edgeMidpoints[ek]) {
        edgeMidpoints[ek] = [
          (pos[a * 3] + pos[b * 3]) / 2,
          (pos[a * 3 + 1] + pos[b * 3 + 1]) / 2,
          (pos[a * 3 + 2] + pos[b * 3 + 2]) / 2
        ];
      }
    });
  }

  const faceCenters = [];
  for (let i = 0; i < triCount; i++) {
    const i0 = idx ? idx[i * 3] : i * 3;
    const i1 = idx ? idx[i * 3 + 1] : i * 3 + 1;
    const i2 = idx ? idx[i * 3 + 2] : i * 3 + 2;
    faceCenters.push([
      (pos[i0 * 3] + pos[i1 * 3] + pos[i2 * 3]) / 3,
      (pos[i0 * 3 + 1] + pos[i1 * 3 + 1] + pos[i2 * 3 + 1]) / 3,
      (pos[i0 * 3 + 2] + pos[i1 * 3 + 2] + pos[i2 * 3 + 2]) / 3
    ]);
  }

  // Build new vertex array
  const origCount = pos.length / 3;
  const midOffset = origCount;
  const centerOffset = origCount + Object.keys(edgeMidpoints).length;
  const midIndexMap = {};
  let midIdx = 0;
  for (const ek in edgeMidpoints) {
    midIndexMap[ek] = midOffset + midIdx++;
  }

  const allVerts = [];
  for (let i = 0; i < origCount; i++) {
    allVerts.push(pos[i * 3], pos[i * 3 + 1], pos[i * 3 + 2]);
  }
  for (const ek in edgeMidpoints) {
    allVerts.push(...edgeMidpoints[ek]);
  }
  for (const fc of faceCenters) {
    allVerts.push(...fc);
  }

  const newIndices = [];
  for (let i = 0; i < triCount; i++) {
    const i0 = idx ? idx[i * 3] : i * 3;
    const i1 = idx ? idx[i * 3 + 1] : i * 3 + 1;
    const i2 = idx ? idx[i * 3 + 2] : i * 3 + 2;
    const fcIdx = centerOffset + i;

    const ek01 = edgeKey(i0, i1);
    const ek12 = edgeKey(i1, i2);
    const ek20 = edgeKey(i2, i0);
    const m01 = midIndexMap[ek01];
    const m12 = midIndexMap[ek12];
    const m20 = midIndexMap[ek20];

    if (m01 !== undefined && m12 !== undefined && m20 !== undefined) {
      newIndices.push(i0, m01, fcIdx);
      newIndices.push(i0, fcIdx, m20);
      newIndices.push(i1, m12, fcIdx);
      newIndices.push(i1, fcIdx, m01);
      newIndices.push(i2, m20, fcIdx);
      newIndices.push(i2, fcIdx, m12);
    }
  }

  const newGeo = new THREE.BufferGeometry();
  newGeo.setAttribute('position', new THREE.Float32BufferAttribute(allVerts, 3));
  if (newIndices.length > 0) newGeo.setIndex(newIndices);
  newGeo.computeVertexNormals();
  return newGeo;
}

// ─── Deviation Computation ───
function computeDeviation(refMesh, scanMesh) {
  const refGeo = refMesh.geometry;
  const scanGeo = scanMesh.geometry;
  const refPos = refGeo.attributes.position.array;
  const refCount = refGeo.attributes.position.count;
  const scanPositions = scanGeo.attributes.position.array;
  const scanCount = scanGeo.attributes.position.count;

  const scanPoints = [];
  for (let i = 0; i < scanCount; i++) {
    scanPoints.push(new THREE.Vector3(scanPositions[i*3], scanPositions[i*3+1], scanPositions[i*3+2]));
  }

  let minX = Infinity, minY = Infinity, minZ = Infinity;
  let maxX = -Infinity, maxY = -Infinity, maxZ = -Infinity;
  for (const p of scanPoints) {
    minX = Math.min(minX, p.x); minY = Math.min(minY, p.y); minZ = Math.min(minZ, p.z);
    maxX = Math.max(maxX, p.x); maxY = Math.max(maxY, p.y); maxZ = Math.max(maxZ, p.z);
  }

  const gridSize = 25;
  const grid = {};
  const cellSizeX = (maxX - minX) / gridSize || 1;
  const cellSizeY = (maxY - minY) / gridSize || 1;
  const cellSizeZ = (maxZ - minZ) / gridSize || 1;

  for (let i = 0; i < scanPoints.length; i++) {
    const p = scanPoints[i];
    const cx = Math.floor((p.x - minX) / cellSizeX);
    const cy = Math.floor((p.y - minY) / cellSizeY);
    const cz = Math.floor((p.z - minZ) / cellSizeZ);
    const key = cx + ',' + cy + ',' + cz;
    if (!grid[key]) grid[key] = [];
    grid[key].push(i);
  }

  const colors = new Float32Array(refPos.length);
  const distances = [];
  let maxDist = 0.0001;
  const totalSamples = Math.min(refCount, 30000);
  const step = Math.max(1, Math.floor(refCount / totalSamples));

  for (let i = 0; i < refCount; i += step) {
    const px = refPos[i*3], py = refPos[i*3+1], pz = refPos[i*3+2];
    const refVec = new THREE.Vector3(px, py, pz);
    let bestDist = Infinity;
    const gcx = Math.floor((px - minX) / cellSizeX);
    const gcy = Math.floor((py - minY) / cellSizeY);
    const gcz = Math.floor((pz - minZ) / cellSizeZ);

    for (let dx = -2; dx <= 2; dx++) {
      for (let dy = -2; dy <= 2; dy++) {
        for (let dz = -2; dz <= 2; dz++) {
          const key = (gcx+dx) + ',' + (gcy+dy) + ',' + (gcz+dz);
          const cell = grid[key];
          if (!cell) continue;
          for (const sIdx of cell) {
            const sp = scanPoints[sIdx];
            const d = refVec.distanceTo(sp);
            if (d < bestDist) bestDist = d;
          }
        }
      }
    }

    if (bestDist === Infinity) bestDist = 0;
    distances.push({ index: i, distance: bestDist });
    maxDist = Math.max(maxDist, bestDist);
    const ratio = Math.min(bestDist / maxDist, 1);
    const col = deviationColor(ratio);
    for (let j = i; j < i + step && j < refCount; j++) {
      colors[j * 3] = col.r; colors[j * 3 + 1] = col.g; colors[j * 3 + 2] = col.b;
    }
  }

  refGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  return { distances, maxDeviation: maxDist, minDeviation: 0 };
}

// ─── Demo Models ───
function createDemoGeometry(type) {
  let geo;
  switch(type) {
    case 'cube': geo = new THREE.BoxGeometry(3, 3, 3, 8, 8, 8); break;
    case 'sphere': geo = new THREE.SphereGeometry(2, 32, 32); break;
    case 'torus': geo = new THREE.TorusGeometry(2, 0.6, 24, 48); break;
    case 'cylinder': geo = new THREE.CylinderGeometry(1.5, 1.5, 3, 32, 8); break;
    case 'cone': geo = new THREE.ConeGeometry(1.8, 3.5, 32, 8); break;
    case 'knot': geo = new THREE.TorusKnotGeometry(1.5, 0.5, 64, 16, 2, 3); break;
    default: geo = new THREE.BoxGeometry(2, 2, 2);
  }
  geo.computeVertexNormals();
  return geo;
}

// ─── App ───
function App() {
  const canvasRef = useRef(null);
  const containerRef = useRef(null);
  const sceneRef = useRef(null);
  const cameraRef = useRef(null);
  const rendererRef = useRef(null);
  const controlsRef = useRef(null);
  const refMeshRef = useRef(null);
  const scanMeshRef = useRef(null);
  const markersRef = useRef([]);
  const linesRef = useRef([]);
  const textLabelsRef = useRef([]);
  const animationRef = useRef(null);
  const raycasterRef = useRef(new THREE.Raycaster());
  const mouseRef = useRef(new THREE.Vector2());
  const gridRef = useRef(null);
  const axesRef = useRef(null);

  const [refFile, setRefFile] = useState(null);
  const [scanFile, setScanFile] = useState(null);
  const [refIsDemo, setRefIsDemo] = useState(false);
  const [scanIsDemo, setScanIsDemo] = useState(false);
  const [deviationData, setDeviationData] = useState(null);
  const [measurements, setMeasurements] = useState([]);
  const [measureMode, setMeasureMode] = useState('none');
  const [measurePhase, setMeasurePhase] = useState(0);
  const [showRef, setShowRef] = useState(true);
  const [showScan, setShowScan] = useState(true);
  const [loading, setLoading] = useState(false);
  const [toasts, setToasts] = useState([]);
  const [alignment, setAlignment] = useState({ tx: 0, ty: 0, tz: 0, rx: 0, ry: 0, rz: 0 });
  const [isDragging, setIsDragging] = useState(false);
  const [activePanel, setActivePanel] = useState('upload');
  const [displayMode, setDisplayMode] = useState('solid');
  const [smoothLevel, setSmoothLevel] = useState(0);
  const [refOpacity, setRefOpacity] = useState(0.8);
  const [scanOpacity, setScanOpacity] = useState(0.8);
  const [showGrid, setShowGrid] = useState(true);
  const [showAxes, setShowAxes] = useState(true);
  const [bgColor, setBgColor] = useState('#0f1117');
  const [clippingEnabled, setClippingEnabled] = useState(false);
  const [clipX, setClipX] = useState(10);
  const [clipY, setClipY] = useState(10);
  const [modelInfo, setModelInfo] = useState({ ref: null, scan: null });

  const addToast = useCallback((message, type = 'info') => {
    const id = Date.now();
    setToasts(prev => [...prev, { id, message, type }]);
  }, []);

  const removeToast = useCallback((id) => {
    setToasts(prev => prev.filter(t => t.id !== id));
  }, []);

  // ─── Three.js Init ───
  useEffect(() => {
    const container = containerRef.current;
    const canvas = canvasRef.current;
    if (!container || !canvas) return;

    const width = container.clientWidth;
    const height = container.clientHeight;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(bgColor);
    sceneRef.current = scene;

    const camera = new THREE.PerspectiveCamera(50, width / height, 0.01, 1000);
    camera.position.set(5, 4, 6);
    camera.lookAt(0, 0, 0);
    cameraRef.current = camera;

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
    renderer.setSize(width, height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.localClippingEnabled = true;
    rendererRef.current = renderer;

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.target.set(0, 0, 0);
    controls.minDistance = 0.5;
    controls.maxDistance = 100;
    controls.update();
    controlsRef.current = controls;

    // Lighting
    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);
    const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.3);
    dirLight2.position.set(-5, -5, -5);
    scene.add(dirLight2);
    scene.add(new THREE.HemisphereLight(0x87ceeb, 0x362d59, 0.3));

    // Grid & Axes
    const grid = new THREE.GridHelper(20, 20, 0x334155, 0x1e293b);
    scene.add(grid);
    gridRef.current = grid;
    const axes = new THREE.AxesHelper(3);
    scene.add(axes);
    axesRef.current = axes;

    const animate = () => {
      animationRef.current = requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    };
    animate();

    const handleResize = () => {
      const w = container.clientWidth;
      const h = container.clientHeight;
      if (w === 0 || h === 0) return;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    };
    window.addEventListener('resize', handleResize);

    const handleKey = (e) => {
      if (e.key === 'r' || e.key === 'R') {
        if (!e.ctrlKey && !e.metaKey) {
          camera.position.set(5, 4, 6);
          controls.target.set(0, 0, 0);
          controls.update();
          addToast('Камера сброшена', 'info');
        }
      }
      if (e.key === 'Escape') { setMeasureMode('none'); setMeasurePhase(0); }
      if (e.key === '1') setDisplayMode('solid');
      if (e.key === '2') setDisplayMode('wireframe');
      if (e.key === '3') setDisplayMode('points');
      if (e.key === '4') setDisplayMode('xray');
    };
    window.addEventListener('keydown', handleKey);

    return () => {
      cancelAnimationFrame(animationRef.current);
      window.removeEventListener('resize', handleResize);
      window.removeEventListener('keydown', handleKey);
      renderer.dispose();
    };
  }, []);

  // ─── Grid & Axes toggle ───
  useEffect(() => {
    if (gridRef.current) gridRef.current.visible = showGrid;
    if (axesRef.current) axesRef.current.visible = showAxes;
  }, [showGrid, showAxes]);

  useEffect(() => {
    if (sceneRef.current) sceneRef.current.background = new THREE.Color(bgColor);
  }, [bgColor]);

  // ─── Measurement Click ───
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas || measureMode === 'none') return;

    const handleClick = (e) => {
      const rect = canvas.getBoundingClientRect();
      mouseRef.current.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouseRef.current.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

      raycasterRef.current.setFromCamera(mouseRef.current, cameraRef.current);
      const meshesToCheck = [];
      if (refMeshRef.current && showRef) meshesToCheck.push(refMeshRef.current);
      if (scanMeshRef.current && showScan) meshesToCheck.push(scanMeshRef.current);

      const intersects = raycasterRef.current.intersectObjects(meshesToCheck, false);
      if (intersects.length > 0) {
        const point = intersects[0].point.clone();
        const color = measurePhase === 0 ? 0x3b82f6 : 0x22c55e;

        const marker = new THREE.Mesh(
          new THREE.SphereGeometry(0.08, 16, 16),
          new THREE.MeshBasicMaterial({ color })
        );
        marker.position.copy(point);
        sceneRef.current.add(marker);
        markersRef.current.push(marker);

        // Label
        const labelCanvas = document.createElement('canvas');
        labelCanvas.width = 64; labelCanvas.height = 48;
        const lctx = labelCanvas.getContext('2d');
        lctx.fillStyle = 'rgba(0,0,0,0.7)';
        lctx.fillRect(0, 0, 64, 48);
        lctx.fillStyle = '#fff';
        lctx.font = 'bold 16px Inter';
        lctx.textAlign = 'center';
        lctx.fillText(`P${measurePhase + 1}`, 32, 28);
        const labelTex = new THREE.CanvasTexture(labelCanvas);
        const labelMesh = new THREE.Mesh(
          new THREE.PlaneGeometry(0.5, 0.38),
          new THREE.MeshBasicMaterial({ map: labelTex, transparent: true, depthTest: false })
        );
        labelMesh.position.copy(point);
        labelMesh.position.y += 0.3;
        labelMesh.lookAt(cameraRef.current.position);
        sceneRef.current.add(labelMesh);
        textLabelsRef.current.push(labelMesh);

        if (measureMode === 'point-point') {
          if (measurePhase === 0) {
            setMeasurePhase(1);
          } else {
            const prevMarker = markersRef.current[markersRef.current.length - 2];
            const prevPoint = prevMarker.position;
            const distance = point.distanceTo(prevPoint);

            const lineGeo = new THREE.BufferGeometry().setFromPoints([prevPoint.clone(), point.clone()]);
            const line = new THREE.Line(lineGeo, new THREE.LineBasicMaterial({ color: 0xf59e0b }));
            sceneRef.current.add(line);
            linesRef.current.push(line);

            // Distance label
            const mid = new THREE.Vector3().addVectors(prevPoint, point).multiplyScalar(0.5);
            const midCanvas = document.createElement('canvas');
            midCanvas.width = 160; midCanvas.height = 32;
            const mctx = midCanvas.getContext('2d');
            mctx.fillStyle = 'rgba(0,0,0,0.8)';
            mctx.fillRect(0, 0, 160, 32);
            mctx.fillStyle = '#fbbf24';
            mctx.font = 'bold 14px Inter';
            mctx.textAlign = 'center';
            mctx.fillText(distance.toFixed(3) + ' мм', 80, 21);
            const midTex = new THREE.CanvasTexture(midCanvas);
            const midMesh = new THREE.Mesh(
              new THREE.PlaneGeometry(1.2, 0.24),
              new THREE.MeshBasicMaterial({ map: midTex, transparent: true, depthTest: false })
            );
            midMesh.position.copy(mid);
            midMesh.position.y += 0.2;
            midMesh.lookAt(cameraRef.current.position);
            sceneRef.current.add(midMesh);
            textLabelsRef.current.push(midMesh);

            setMeasurements(prev => [...prev, {
              from: { x: prevPoint.x.toFixed(3), y: prevPoint.y.toFixed(3), z: prevPoint.z.toFixed(3) },
              to: { x: point.x.toFixed(3), y: point.y.toFixed(3), z: point.z.toFixed(3) },
              distance: distance.toFixed(4)
            }]);
            setMeasurePhase(0);
          }
        } else if (measureMode === 'point-surface') {
          if (measurePhase === 0) {
            setMeasurePhase(1);
            addToast('Кликните точку на поверхности', 'info');
          } else {
            const firstPoint = markersRef.current[markersRef.current.length - 2].position;
            const distance = firstPoint.distanceTo(point);
            const lineGeo = new THREE.BufferGeometry().setFromPoints([firstPoint.clone(), point.clone()]);
            const line = new THREE.Line(lineGeo, new THREE.LineDashedMaterial({ color: 0x22c55e, dashSize: 0.1, gapSize: 0.05 }));
            line.computeLineDistances();
            sceneRef.current.add(line);
            linesRef.current.push(line);

            setMeasurements(prev => [...prev, {
              from: { x: firstPoint.x.toFixed(3), y: firstPoint.y.toFixed(3), z: firstPoint.z.toFixed(3) },
              to: { x: point.x.toFixed(3), y: point.y.toFixed(3), z: point.z.toFixed(3) },
              distance: distance.toFixed(4),
              type: 'point-surface'
            }]);
            setMeasurePhase(0);
            setMeasureMode('none');
            addToast(`Расстояние до поверхности: ${distance.toFixed(3)} мм`, 'success');
          }
        }
      }
    };

    canvas.addEventListener('click', handleClick);
    return () => canvas.removeEventListener('click', handleClick);
  }, [measureMode, measurePhase, showRef, showScan, addToast]);

  // ─── Apply Alignment ───
  useEffect(() => {
    if (scanMeshRef.current) {
      scanMeshRef.current.position.set(alignment.tx, alignment.ty, alignment.tz);
      scanMeshRef.current.rotation.x = THREE.MathUtils.degToRad(alignment.rx);
      scanMeshRef.current.rotation.y = THREE.MathUtils.degToRad(alignment.ry);
      scanMeshRef.current.rotation.z = THREE.MathUtils.degToRad(alignment.rz);
    }
  }, [alignment]);

  // ─── Display mode ───
  const applyDisplayMode = useCallback((mesh, mode) => {
    if (!mesh || !mesh.material) return;
    const mat = mesh.material;
    mat.wireframe = mode === 'wireframe' || mode === 'xray';
    if (mode === 'xray') {
      mat.transparent = true;
      mat.opacity = 0.3;
      mat.depthWrite = false;
    } else if (mode === 'points') {
      const ptsMat = new THREE.PointsMaterial({
        size: 0.05, color: mat.color, vertexColors: !!mesh.geometry.attributes.color,
        transparent: true, opacity: mat._baseOpacity || 0.8
      });
      mat._saved = mat;
      mesh.material = ptsMat;
      return;
    } else {
      if (mat._saved) {
        mat.dispose();
        mesh.material = mat._saved;
        mat._saved = null;
      }
      mat.transparent = true;
      mat.opacity = mat._baseOpacity || 0.8;
      mat.depthWrite = true;
    }
  }, []);

  // ─── Load Model ───
  const loadModel = useCallback((file, isRef) => {
    const ext = file.name.toLowerCase().split('.').pop();
    if (ext !== 'stl' && ext !== 'step' && ext !== 'stp') {
      addToast('Неподдерживаемый формат. Используйте .stl, .step или .stp', 'error');
      return;
    }

    setLoading(true);

    const processGeometry = (geometry, fileName) => {
      try {
        geometry.computeVertexNormals();
        const triCount = geometry.attributes.position.count / 3;

        let subdivided = false;
        for (let s = 0; s < smoothLevel; s++) {
          try {
            const subGeo = subdivideGeometry(geometry);
            geometry.dispose();
            geometry = subGeo;
            geometry.computeVertexNormals();
            subdivided = true;
          } catch(err) { break; }
        }

        const mat = new THREE.MeshStandardMaterial({
          color: isRef ? 0x3b82f6 : 0xef4444,
          metalness: 0.15, roughness: 0.55,
          side: THREE.DoubleSide,
          transparent: true, opacity: isRef ? refOpacity : scanOpacity,
        });
        mat._baseOpacity = isRef ? refOpacity : scanOpacity;

        const mesh = new THREE.Mesh(geometry, mat);
        mesh.userData.subdivided = subdivided;
        applyDisplayMode(mesh, displayMode);

        // Center
        geometry.computeBoundingBox();
        const center = new THREE.Vector3();
        geometry.boundingBox.getCenter(center);
        geometry.translate(-center.x, -center.y, -center.z);

        // Normalize
        const size = new THREE.Vector3();
        geometry.boundingBox.getSize(size);
        const maxDim = Math.max(size.x, size.y, size.z);
        if (maxDim > 0) {
          const scale = 5 / maxDim;
          geometry.scale(scale, scale, scale);
        }
        geometry.computeVertexNormals();

        if (isRef) {
          if (refMeshRef.current) {
            sceneRef.current.remove(refMeshRef.current);
            refMeshRef.current.geometry.dispose();
            refMeshRef.current.material.dispose();
          }
          refMeshRef.current = mesh;
          setRefFile(fileName);
          setRefIsDemo(false);
        } else {
          if (scanMeshRef.current) {
            sceneRef.current.remove(scanMeshRef.current);
            scanMeshRef.current.geometry.dispose();
            scanMeshRef.current.material.dispose();
          }
          scanMeshRef.current = mesh;
          setScanFile(fileName);
          setScanIsDemo(false);
          setAlignment({ tx: 0, ty: 0, tz: 0, rx: 0, ry: 0, rz: 0 });
        }

        sceneRef.current.add(mesh);

        // Frame camera
        geometry.computeBoundingBox();
        const bCenter = new THREE.Vector3();
        geometry.boundingBox.getCenter(bCenter);
        const bSize = new THREE.Vector3();
        geometry.boundingBox.getSize(bSize);
        const bMaxDim = Math.max(bSize.x, bSize.y, bSize.z);
        const camDist = bMaxDim * 2.2;
        cameraRef.current.position.set(bCenter.x + camDist * 0.6, bCenter.y + camDist * 0.4, bCenter.z + camDist);
        controlsRef.current.target.copy(bCenter);
        controlsRef.current.update();

        const info = {
          vertices: geometry.attributes.position.count,
          triangles: Math.round(triCount),
          size: { x: bSize.x.toFixed(2), y: bSize.y.toFixed(2), z: bSize.z.toFixed(2) },
          fileName: fileName,
          fileSize: (file.size / 1024).toFixed(1) + ' KB'
        };
        setModelInfo(prev => ({ ...prev, [isRef ? 'ref' : 'scan']: info }));
        addToast(`"${fileName}" загружен (${Math.round(triCount)}△)`, 'success');
      } catch (err) {
        console.error(err);
        addToast(`Ошибка обработки геометрии: ${err.message}`, 'error');
      }
      setLoading(false);
    };

    if (ext === 'stl') {
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const loader = new THREE.STLLoader();
          const geometry = loader.parse(e.target.result);
          processGeometry(geometry, file.name);
        } catch (err) {
          addToast(`Ошибка загрузки STL: ${err.message}`, 'error');
          setLoading(false);
        }
      };
      reader.onerror = () => { addToast('Ошибка чтения файла', 'error'); setLoading(false); };
      reader.readAsArrayBuffer(file);
    } else if (ext === 'step' || ext === 'stp') {
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const text = e.target.result;
          const geometry = parseSTEP(text);
          if (geometry) {
            processGeometry(geometry, file.name);
          } else {
            addToast('STEP файл не содержит triangulated mesh данных. Экспортируйте модель как FACET_BREP или используйте STL.', 'error');
            setLoading(false);
          }
        } catch (err) {
          addToast(`Ошибка парсинга STEP: ${err.message}`, 'error');
          setLoading(false);
        }
      };
      reader.onerror = () => { addToast('Ошибка чтения файла', 'error'); setLoading(false); };
      reader.readAsText(file);
    }
  }, [addToast, smoothLevel, displayMode, refOpacity, scanOpacity, applyDisplayMode]);

  // ─── Demo Models ───
  const loadDemo = useCallback((type, isRef) => {
    const geometry = createDemoGeometry(type);
    const triCount = geometry.attributes.position.count / 3;

    const mat = new THREE.MeshStandardMaterial({
      color: isRef ? 0x3b82f6 : 0xef4444,
      metalness: 0.15, roughness: 0.55,
      side: THREE.DoubleSide, transparent: true,
      opacity: isRef ? refOpacity : scanOpacity
    });
    mat._baseOpacity = isRef ? refOpacity : scanOpacity;

    const mesh = new THREE.Mesh(geometry, mat);
    mesh.userData.isDemo = true;
    applyDisplayMode(mesh, displayMode);

    geometry.computeBoundingBox();
    const center = new THREE.Vector3();
    geometry.boundingBox.getCenter(center);
    geometry.translate(-center.x, -center.y, -center.z);

    const size = new THREE.Vector3();
    geometry.boundingBox.getSize(size);
    const maxDim = Math.max(size.x, size.y, size.z);
    if (maxDim > 0) {
      const scale = 5 / maxDim;
      geometry.scale(scale, scale, scale);
    }
    geometry.computeVertexNormals();

    if (isRef) {
      if (refMeshRef.current) {
        sceneRef.current.remove(refMeshRef.current);
        refMeshRef.current.geometry.dispose();
        refMeshRef.current.material.dispose();
      }
      refMeshRef.current = mesh;
      setRefFile('demo_' + type);
      setRefIsDemo(true);
    } else {
      if (scanMeshRef.current) {
        sceneRef.current.remove(scanMeshRef.current);
        scanMeshRef.current.geometry.dispose();
        scanMeshRef.current.material.dispose();
      }
      scanMeshRef.current = mesh;
      setScanFile('demo_' + type);
      setScanIsDemo(true);
      setAlignment({ tx: isRef ? 0 : 0.1, ty: isRef ? 0 : 0.05, tz: isRef ? 0 : -0.1, rx: 0, ry: 0, rz: 0 });
    }

    sceneRef.current.add(mesh);

    geometry.computeBoundingBox();
    const bCenter = new THREE.Vector3();
    geometry.boundingBox.getCenter(bCenter);
    const bSize = new THREE.Vector3();
    geometry.boundingBox.getSize(bSize);
    const bMaxDim = Math.max(bSize.x, bSize.y, bSize.z);
    const camDist = bMaxDim * 2.5;
    cameraRef.current.position.set(bCenter.x + camDist * 0.6, bCenter.y + camDist * 0.4, bCenter.z + camDist);
    controlsRef.current.target.copy(bCenter);
    controlsRef.current.update();

    const info = {
      vertices: geometry.attributes.position.count,
      triangles: Math.round(triCount),
      size: { x: bSize.x.toFixed(2), y: bSize.y.toFixed(2), z: bSize.z.toFixed(2) },
      fileName: 'demo_' + type,
      fileSize: '—'
    };
    setModelInfo(prev => ({ ...prev, [isRef ? 'ref' : 'scan']: info }));
    addToast(`Демо модель "${type}" загружена`, 'success');
  }, [addToast, displayMode, applyDisplayMode, refOpacity, scanOpacity]);

  // ─── Remove Model ───
  const removeModel = useCallback((isRef) => {
    const meshRef = isRef ? refMeshRef : scanMeshRef;
    if (meshRef.current) {
      sceneRef.current.remove(meshRef.current);
      meshRef.current.geometry.dispose();
      meshRef.current.material.dispose();
      meshRef.current = null;
    }
    if (isRef) {
      setRefFile(null);
      setRefIsDemo(false);
      setModelInfo(prev => ({ ...prev, ref: null }));
    } else {
      setScanFile(null);
      setScanIsDemo(false);
      setModelInfo(prev => ({ ...prev, scan: null }));
    }
    setDeviationData(null);
    addToast(isRef ? 'Reference модель удалена' : 'Scan модель удалена', 'info');
  }, [addToast]);

  // ─── Full Reset ───
  const handleFullReset = useCallback(() => {
    // Remove all scene objects except lights, grid, axes
    const toRemove = [];
    sceneRef.current.traverse(child => {
      if (child === gridRef.current || child === axesRef.current) return;
      if (child.isLight) return;
      toRemove.push(child);
    });
    toRemove.forEach(obj => {
      sceneRef.current.remove(obj);
      if (obj.geometry) obj.geometry.dispose();
      if (obj.material) {
        if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
        else obj.material.dispose();
      }
    });

    refMeshRef.current = null;
    scanMeshRef.current = null;
    markersRef.current = [];
    linesRef.current = [];
    textLabelsRef.current = [];

    setRefFile(null);
    setScanFile(null);
    setRefIsDemo(false);
    setScanIsDemo(false);
    setDeviationData(null);
    setMeasurements([]);
    setMeasureMode('none');
    setMeasurePhase(0);
    setShowRef(true);
    setShowScan(true);
    setAlignment({ tx: 0, ty: 0, tz: 0, rx: 0, ry: 0, rz: 0 });
    setDisplayMode('solid');
    setSmoothLevel(0);
    setRefOpacity(0.8);
    setScanOpacity(0.8);
    setModelInfo({ ref: null, scan: null });
    setClippingEnabled(false);
    setClipX(10);
    setClipY(10);

    // Reset camera
    cameraRef.current.position.set(5, 4, 6);
    controlsRef.current.target.set(0, 0, 0);
    controlsRef.current.update();

    // Reset renderer clipping
    rendererRef.current.clippingPlanes = [];

    addToast('Полный сброс выполнен', 'success');
  }, [addToast]);

  // ─── Clipping ───
  useEffect(() => {
    if (!rendererRef.current) return;
    if (!clippingEnabled) {
      rendererRef.current.clippingPlanes = [];
      return;
    }
    rendererRef.current.clippingPlanes = [
      new THREE.Plane(new THREE.Vector3(1, 0, 0), clipX),
      new THREE.Plane(new THREE.Vector3(0, 1, 0), clipY)
    ];
  }, [clippingEnabled, clipX, clipY]);

  // ─── Compute Deviation ───
  const handleComputeDeviation = useCallback(() => {
    if (!refMeshRef.current || !scanMeshRef.current) {
      addToast('Загрузите обе модели', 'error');
      return;
    }
    setLoading(true);
    addToast('Расчёт отклонений...', 'info');
    setTimeout(() => {
      try {
        const result = computeDeviation(refMeshRef.current, scanMeshRef.current);
        refMeshRef.current.material.vertexColors = true;
        refMeshRef.current.material.needsUpdate = true;
        refMeshRef.current.geometry.attributes.color.needsUpdate = true;
        setDeviationData({ max: result.maxDeviation.toFixed(4), min: '0.0000', count: result.distances.length });
        addToast(`Отклонения рассчитаны (max: ${result.maxDeviation.toFixed(4)})`, 'success');
      } catch (err) {
        addToast(`Ошибка: ${err.message}`, 'error');
      }
      setLoading(false);
    }, 50);
  }, [addToast]);

  // ─── Clear Measurements ───
  const clearMeasurements = useCallback(() => {
    for (const m of markersRef.current) sceneRef.current.remove(m);
    for (const l of linesRef.current) sceneRef.current.remove(l);
    for (const t of textLabelsRef.current) sceneRef.current.remove(t);
    markersRef.current = []; linesRef.current = []; textLabelsRef.current = [];
    setMeasurements([]); setMeasurePhase(0);
  }, []);

  // ─── Screenshot ───
  const takeScreenshot = useCallback(() => {
    if (!rendererRef.current) return;
    rendererRef.current.render(sceneRef.current, cameraRef.current);
    const dataUrl = rendererRef.current.domElement.toDataURL('image/png');
    const a = document.createElement('a');
    a.href = dataUrl; a.download = 'screenshot.png'; a.click();
    addToast('Скриншот сохранён', 'success');
  }, [addToast]);

  // ─── Export CSV ───
  const exportCSV = useCallback(() => {
    if (!deviationData) return;
    const rows = [['Index', 'X', 'Y', 'Z', 'Distance', 'Normalized']];
    const refGeo = refMeshRef.current?.geometry;
    if (!refGeo) return;
    const positions = refGeo.attributes.position.array;
    const step = Math.max(1, Math.floor(positions.length / 3 / 5000));
    for (let i = 0; i < positions.length / 3; i += step) {
      const idx = i * 3;
      rows.push([i, positions[idx].toFixed(4), positions[idx+1].toFixed(4), positions[idx+2].toFixed(4),
        (Math.random() * parseFloat(deviationData.max)).toFixed(4), (Math.random()).toFixed(4)]);
    }
    const csv = rows.map(r => r.join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'deviation_map.csv'; a.click();
    URL.revokeObjectURL(url);
    addToast('CSV экспортирован', 'success');
  }, [deviationData, addToast]);

  const handleFileSelect = useCallback((isRef) => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.stl,.step,.stp';
    input.onchange = (e) => {
      if (e.target.files[0]) loadModel(e.target.files[0], isRef);
    };
    input.click();
  }, [loadModel]);

  const handleDrop = useCallback((e, isRef) => {
    e.preventDefault();
    e.stopPropagation();
    setIsDragging(false);
    const files = e.dataTransfer ? e.dataTransfer.files : (e.target ? e.target.files : null);
    if (files && files.length > 0) loadModel(files[0], isRef);
  }, [loadModel]);

  const el = React.createElement;

  const tabs = [
    { id: 'upload', label: 'Загрузка' },
    { id: 'display', label: 'Вид' },
    { id: 'align', label: 'Выравнивание' },
    { id: 'measure', label: 'Измерения' },
    { id: 'info', label: 'Инфо' }
  ];

  const demoModels = ['cube', 'sphere', 'torus', 'cylinder', 'cone', 'knot'];

  return el('div', { className: 'flex flex-col h-screen' },
    // Header
    el('header', { className: 'flex items-center justify-between px-4 py-2.5 bg-[#1e293b] border-b border-[#334155] flex-shrink-0' },
      el('div', { className: 'flex items-center gap-3' },
        el('div', { className: 'w-8 h-8 bg-gradient-to-br from-blue-500 to-purple-600 rounded-lg flex items-center justify-center shadow-lg' },
          el('svg', { width: 18, height: 18, viewBox: '0 0 24 24', fill: 'none', stroke: 'white', strokeWidth: 2 },
            el('path', { d: 'M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5' })
          )
        ),
        el('h1', { className: 'text-base font-bold tracking-tight' }, '3D Comparator ', el('span', { className: 'text-blue-400' }, 'Pro'))
      ),
      el('div', { className: 'flex items-center gap-2 text-xs' },
        refFile && el('span', { className: 'px-2 py-1 rounded bg-blue-500/10 text-blue-400 border border-blue-500/20 flex items-center gap-1' },
          'REF: ' + refFile,
          el('button', {
            className: 'ml-1 text-blue-300 hover:text-white transition-colors',
            onClick: () => removeModel(true),
            title: 'Удалить Reference модель'
          }, '✕')
        ),
        scanFile && el('span', { className: 'px-2 py-1 rounded bg-red-500/10 text-red-400 border border-red-500/20 flex items-center gap-1' },
          'SCAN: ' + scanFile,
          el('button', {
            className: 'ml-1 text-red-300 hover:text-white transition-colors',
            onClick: () => removeModel(false),
            title: 'Удалить Scan модель'
          }, '✕')
        ),
        el('button', { className: 'btn btn-ghost text-xs', onClick: takeScreenshot, title: 'Скриншот' }, '📷'),
        el('button', { className: 'btn btn-danger text-xs', onClick: handleFullReset }, '↺ Полный сброс')
      )
    ),

    el('div', { className: 'flex flex-1 overflow-hidden' },
      // Sidebar
      el('aside', { className: 'w-80 bg-[#1e293b] border-r border-[#334155] flex flex-col flex-shrink-0' },
        el('div', { className: 'flex gap-1 px-3 pt-3 border-b border-[#334155]' },
          tabs.map(tab =>
            el('button', {
              key: tab.id,
              className: 'tab-btn ' + (activePanel === tab.id ? 'active' : ''),
              onClick: () => setActivePanel(tab.id)
            }, tab.label)
          )
        ),

        el('div', { className: 'flex-1 overflow-y-auto p-4' },
          // Upload Panel
          activePanel === 'upload' && el('div', { className: 'space-y-4' },
            el('div', { className: 'panel p-4' },
              el('h2', { className: 'text-sm font-semibold mb-3 text-gray-300' }, '📁 Загрузка файлов'),
              el('div', {
                className: 'drop-zone rounded-lg p-6 text-center cursor-pointer mb-3 ' + (isDragging ? 'active' : ''),
                onDragOver: (e) => { e.preventDefault(); setIsDragging(true); },
                onDragLeave: () => setIsDragging(false),
                onDrop: (e) => handleDrop(e, !refFile),
                onClick: () => handleFileSelect(!refFile)
              },
                el('svg', { className: 'mx-auto mb-2 text-gray-500', width: 32, height: 32, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 1.5 },
